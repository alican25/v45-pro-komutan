
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V4.5-PRO Kontrol Paneli</title>
    <!-- Telegram Web App kütüphanesi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* SİBER KARBON SİYAHI TEMA */
        :root {
            --bg-color: #0d0f12; /* Karbon Siyahı */
            --text-color: #e0e6ed;
            --accent-blue: #00e5ff; /* Buz Mavisi (Asistan) */
            --accent-green: #00ff88; /* Soğuk Çelik Yeşili (Otonom) */
            --panel-bg: #161a22;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace; /* Monospace hizalama */
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            color: var(--accent-blue);
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* BÖLÜM 1: Kasa Özeti */
        .wallet-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }
        .total-balance {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        .budget-bar {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            display: flex;
            overflow: hidden;
        }
        .budget-safe { width: 70%; background-color: var(--accent-blue); } /* %70 Okyanus Çapası */
        .budget-risk { width: 30%; background-color: var(--accent-green); } /* %30 Roket */

        /* BÖLÜM 2: VIP Portföy */
        .vip-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ffaa00; /* VIP Sarısı */
        }

        /* BÖLÜM 3: Otonom Alan */
        .autonomous-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-green);
        }
        
        .coin-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #333;
        }

        button.action-btn {
            background-color: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.action-btn:active {
            background-color: var(--accent-blue);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <h1>V4.5-PRO ARAYÜZÜ</h1>

    <div class="wallet-panel">
        <div>TOPLAM KASA</div>
        <div class="total-balance">$10,450.00</div>
        <div style="display:flex; justify-content:space-between; font-size: 0.8rem; margin-bottom:5px;">
            <span style="color:var(--accent-blue);">%70 Okyanus</span>
            <span style="color:var(--accent-green);">%30 Roket</span>
        </div>
        <div class="budget-bar">
            <div class="budget-safe"></div>
            <div class="budget-risk"></div>
        </div>
    </div>

    <div class="vip-panel">
        <h3 style="margin-top:0; color:#ffaa00;">MANUEL VIP PORTFÖY</h3>
        <div class="coin-row"><span>BTC/USDT</span><span style="color:var(--accent-green);">+2.4%</span></div>
        <div class="coin-row"><span>ETH/USDT</span><span style="color:#ff4444;">-1.2%</span></div>
        <div style="font-size:0.8rem; color:#888; margin-top:10px;">⚠️ Uyarılar burada görünecek</div>
    </div>

    <div class="autonomous-panel">
        <h3 style="margin-top:0; color:var(--accent-green);">OTONOM AV SAHASI (EPS)</h3>
        <div class="coin-row"><span>SUI/USDT</span><span style="color:var(--accent-green);">+8.7%</span></div>
        <button class="action-btn" onclick="sendDataToBot()" style="margin-top:15px; border-color:var(--accent-green); color:var(--accent-green);">KILL SWITCH (DURDUR)</button>
    </div>

    <script>
        // Telegram Web App API'sini başlat
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ekranı tam kapla

        // Tema renklerini Telegram'dan çekmeye çalış (opsiyonel)
        // tg.backgroundColor = '#0d0f12'; 

        function sendDataToBot() {
            // Butona basıldığında Python (Colab) tarafına veri gönderir
            tg.sendData("KILL_SWITCH_TRIGGERED");
            tg.close(); // Paneli kapatır
        }
    </script>
</body>
</html>
